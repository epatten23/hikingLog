<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hiking Log</title>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js"></script>
    <script src="hiking.js" defer></script>
    <style>
      body{
        margin: 0 auto;
        font-family: system-ui;
        padding: 2rem 1rem;
        line-height: 1.5;
        color: #2d3436;
      }
      h1 {
        border-bottom: 2px solid #2d3436;
        padding-bottom: 0.5rem;
      }
      .group {
        list-style: none;
      }
      input {
        padding: 0.4rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        width: 25%;
        box-sizing: border-box;
      }
      input:focus {
        outline: 2px solid #2d6a4f;
        border-color: transparent;
      }
      button {
        background: #2d6a4f;
        color: white;
        border: none;
        border-radius: 4px;
        padding: 0.6rem 1.2rem;
      }
      button:hover {
        background: #1b4332;
      }
      li {
        list-style: none;
      }
      #error-message {
        color: red;
      }
      
    </style>
  </head>
  <body>
    <h1>Hiking Log</h1>
    <p>Add a hike to keep a simple trail record.</p>

    <h2>Add a hike</h2>
    <form id="hike-form">
      <p>
        <label for="hike-name">Trail name</label><br />
        <input id="hike-name" type="text"/>
      </p>
      <p>
        <label for="hike-date">Date</label><br />
        <input id="hike-date" type="date"/>
      </p>
      <p>
        <label for="hike-distance">Distance in miles</label><br />
        <input id="hike-distance" type="number" min="0.1" step="0.1"/>
      </p>
      <p>
        <label for="hike-elevation">Elevation gain in feet</label><br />
        <input id="hike-elevation" type="number" min="0" step="0.1"/>
      </p>
      <p>
        <label for="hike-duration">Duration in hours</label><br />
        <input id="hike-duration" type="number" min="0.1" step="0.1"/>
      </p>
      <button type="submit">Add hike</button>
    </form>
    <p id="error-message"></p>  
    <h2>Your hikes</h2>
    <ul id="hike-list"></ul>
  </body>
</html>
